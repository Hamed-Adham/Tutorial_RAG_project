version: '3.8'

services:
  # Vector Store
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-rag
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  # Knowledge Graph Store
  neo4j:
    image: neo4j:latest
    container_name: neo4j-rag
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  # Relational Database for Catalog, Manifest & Text-to-SQL
  postgres:
    image: postgres:16-alpine
    container_name: postgres-rag
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=unified_rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Embedding & Response Cache
  redis:
    image: redis:7-alpine
    container_name: redis-rag
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  qdrant_data:
  neo4j_data:
  postgres_data:
  redis_data:
